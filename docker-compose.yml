# ==========================================
# The Mad Story - Production Docker Compose
# ==========================================

services:
  # Gateway / Ingress Reverse Proxy
  gateway:
    image: nginx:alpine
    container_name: madstory-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - madstory-network

  # Frontend React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: madstory-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - madstory-network

  # Django Backend API (Gunicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: madstory-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=False
      - DATABASE_URL=postgres://${POSTGRES_USER:-madstory}:${POSTGRES_PASSWORD:-madstory_secret}@db:5432/${POSTGRES_DB:-madstory}
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - madstory-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: madstory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madstory}
      POSTGRES_USER: ${POSTGRES_USER:-madstory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madstory_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madstory} -d ${POSTGRES_DB:-madstory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - madstory-network

  # Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: madstory-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - madstory-network

volumes:
  postgres_data:
    driver: local
  staticfiles_data:
    driver: local
  media_data:
    driver: local

networks:
  madstory-network:
    driver: bridge
