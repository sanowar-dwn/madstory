services:
  # ============================================================================
  # Backend Web Service (Django REST Framework + Gunicorn + WhiteNoise)
  # ============================================================================
  - type: web
    name: madstory-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn -c gunicorn.conf.py config.wsgi:application"
    plan: starter
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://themadstory.com
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,themadstory.com,www.themadstory.com,api.themadstory.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://themadstory.com,https://www.themadstory.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://themadstory.com,https://www.themadstory.com,https://api.themadstory.com"
      - key: AUTO_LOAD_FIXTURE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: madstory-db
          property: connectionString

  # ============================================================================
  # Frontend Static Site (React + Vite + Tailwind SPA)
  # ============================================================================
  - type: static_site
    name: madstory-frontend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishPath: "dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://madstory-backend.onrender.com/api/v1

# ==============================================================================
# Managed PostgreSQL Database (Optional - can be replaced with Neon/Supabase or SQLite disk)
# ==============================================================================
databases:
  - name: madstory-db
    databaseName: madstory
    user: madstory_user
    plan: starter
